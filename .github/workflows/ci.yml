name: checks
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[web,dev]'
      - run: python -m unittest discover -v
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m pip uninstall -y devos-vault
      - run: python -m pip install --no-index --find-links=dist devos-vault
      - run: python tests/wheel_smoke.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[web,dev]'
      - run: python -m ruff check src tests tools
      - run: python -m mypy src
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: python tools/export_openapi.py
      - run: npm run api:generate
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: git diff --exit-code -- web/openapi.json web/src/api/schema.ts src/devos/web_dist
